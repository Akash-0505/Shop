
server:
  port: 8080

spring:
  application:
    name: API-Gateway

  http:
    clients:
      imperative:
        factory: jdk

  cloud:
    gateway:
      server:
        webmvc:
          routes:
            - id: Product
              uri: lb://Product
              predicates:
                - Path=/product/**

            - id: Order
              uri: lb://Order
              predicates:
                - Path=/Order/**

eureka:
  client:
    register-with-eureka: true
    fetch-registry: true
    service-url:
      defaultZone: http://localhost:8761/eureka/
